<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "base.html" %}

{% block title %}Add New Job{% endblock %}

{% block content %}
    <h2>Post a New Job</h2>
    <hr>
    <form action="/add_job" method="POST" style="max-width: 500px;">
        <label style="font-weight: bold;">Job Title:</label><br>
        <input type="text" name="title" required style="width: 100%; padding: 10px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 4px;"><br>
        
        <label style="font-weight: bold;">Requirements:</label><br>
        <textarea name="requirement" rows="4" required style="width: 100%; padding: 10px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 4px;"></textarea><br>
        
        <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Add Job</button>
    </form>
{% endblock %}

</body>
</html>
